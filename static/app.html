<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간호학과 시간표 배치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 학과 사무실의 업무 도구 — 차분하고 정확하게, 위반은 분명하게
   IDEA: 게시판에 붙이는 인쇄 시간표 — 요일×교시 격자에 학년 색 띠
   PICTURE: 시간표 격자 자체가 첫 화면을 채움
   COLOUR and TYPE: 흰 종이 + 짙은 먹색, 학년 4색(파랑·초록·주황·자주), 위반은 빨강 / IBM Plex Sans KR
   LAYOUT: 위 막대(제목·상태·실행) → 탭 → 넓은 격자, 좁은 화면은 가로 스크롤 */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f3,#15181c);--paper:light-dark(#ffffff,#1e2228);--ink:light-dark(#1c232b,#e7eaee);--mute:light-dark(#66707b,#9aa4ae);--line:light-dark(#dfe2e5,#343a42);--soft:light-dark(#eef0f2,#262b32);
--g1:light-dark(#2f6fb0,#7fb2e8);--g2:light-dark(#2f8a5c,#77c79c);--g3:light-dark(#c4621e,#f0a46b);--g4:light-dark(#7d4fb8,#bc98ea);
--g1b:light-dark(#e6eef8,#1f2d3c);--g2b:light-dark(#e5f3eb,#1c3127);--g3b:light-dark(#fbeee3,#3a2a1d);--g4b:light-dark(#f0e9f9,#2d2438);
--bad:light-dark(#c62828,#ff7b72);--badb:light-dark(#fdecec,#3d1f1f);--warn:light-dark(#9a6b00,#e3b341);--warnb:light-dark(#fff6dc,#352c14);--ok:light-dark(#2f8a5c,#77c79c);--acc:light-dark(#1c232b,#e7eaee)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:14px max(3vw,14px);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:sticky;top:0;z-index:5}
.top h1{font-size:22px;line-height:1.1;margin:0;font-weight:700}
.top .sem{color:var(--mute);font-size:14px}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500;white-space:nowrap;border:0;cursor:pointer}
.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.ok{background:var(--g2b);color:var(--ok)}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--acc);color:var(--paper);border-color:var(--acc)}.btn.pri:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.dirty{outline:2px solid var(--g3);outline-offset:1px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
.tabs{display:flex;gap:2px;padding:0 max(3vw,14px);background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:18px max(3vw,14px) 60px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.bar label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number]{min-height:36px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:4px 8px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:0 12px;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.scroll{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;table-layout:fixed}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;vertical-align:top}
.tt thead th{background:var(--soft);font-size:13px;font-weight:500;position:sticky;top:0}
.tt .day{writing-mode:horizontal-tb;font-weight:700;font-size:15px;text-align:center;vertical-align:middle;width:40px;background:var(--soft)}
.tt .per{width:62px;font-size:12px;color:var(--mute);white-space:nowrap}
.tt .per b{display:block;color:var(--ink);font-size:13px}
.tt tr.lunch td{background:var(--soft);height:10px;padding:0;font-size:11px;color:var(--mute);text-align:center}
.tt tr.dayend td,.tt tr.dayend th{border-bottom:2px solid var(--ink)}
.tt td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 8px)}
.chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:var(--cb);border-radius:5px;padding:3px 6px;margin:1px 0;font-size:12.5px;line-height:1.3;cursor:pointer;color:var(--ink)}
.chip b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cont{opacity:.55;padding-block:1px}.chip.cont b{font-weight:400}
.chip.clash{outline:2px solid var(--bad);outline-offset:-1px}
.chip.lock::after{content:"고정";float:right;font-size:10px;color:var(--mute)}
.g1{--c:var(--g1);--cb:var(--g1b)}.g2{--c:var(--g2);--cb:var(--g2b)}.g3{--c:var(--g3);--cb:var(--g3b)}.g4{--c:var(--g4);--cb:var(--g4b)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:-1px;margin-right:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 8px}
.hint{color:var(--mute);font-size:13px;margin:4px 0 10px}
.issues{list-style:none;margin:0;padding:0}
.issues li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.badge{font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap;font-weight:500}
.badge.bad{background:var(--badb);color:var(--bad)}.badge.warn{background:var(--warnb);color:var(--warn)}
table.ed{border-collapse:collapse;width:100%;background:var(--paper);font-size:13.5px}
.ed th{background:var(--soft);text-align:left;font-weight:500;padding:6px;border:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
.ed td{border:1px solid var(--line);padding:0}
.ed td input,.ed td select{width:100%;border:0;border-radius:0;min-height:34px;background:transparent;font-size:13.5px;padding:2px 6px}
.ed td.ro{padding:4px 6px;color:var(--mute)}
.ed tr.off td{background:var(--soft)}
.ed .del{border:0;background:none;color:var(--mute);cursor:pointer;min-height:34px;width:100%}
.ed .del:hover{color:var(--bad)}
.edwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:20px;width:min(92vw,460px)}
dialog::backdrop{background:rgb(0 0 0/.35)}
dialog h3{margin:0 0 4px;font-size:18px}
dialog .row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:10px 0}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 6px}.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.banner{background:var(--warnb);color:var(--ink);padding:10px max(3vw,14px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{color:var(--mute);padding:30px;text-align:center}
.small{font-size:12.5px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){.top h1{font-size:19px}.acts{margin-left:0}.tt{min-width:640px}}
.tt.wide{min-width:1800px}
</style>
</head>
<body>
<header class="top">
  <div><h1>간호학과 시간표 배치</h1><div class="sem" id="sem"></div></div>
  <div class="stat" id="stat"></div>
  <div class="acts">
    <button class="btn pri" id="runBtn">자동 배치</button>
    <button class="btn" id="saveBtn" title="모든 사람이 보는 앱에 저장">저장</button>
    <label class="btn" style="display:inline-flex;align-items:center">엑셀 불러오기<input type="file" id="fileIn" accept=".xlsx" hidden></label>
    <button class="btn" id="xlsBtn">엑셀로 내보내기</button>
    <span id="who" class="small" style="align-self:center"></span>
  </div>
</header>
<div id="banner"></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script>window.TT_HOST = "server";</script>
<script id="state" type="application/json">null</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>// 간호학과 시간표 자동 배치 엔진 (브라우저·Node 공용)
// 배치 방식: 조건 점수(반드시=큰 벌점, 가능하면=작은 벌점)를 최소화하는 담금질(simulated annealing)
const TT = (() => {
  const DAYS = ['월', '화', '수', '목', '금'];
  const H = 1000; // '반드시' 조건 1건 벌점
  const PRACTICE = new Set(['기본간호실습실', '시뮬레이션실습실', '실습실']);

  function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
  function parseWeeks(str, total) {
    const s = String(str ?? '').trim();
    if (!s) return range(1, total);
    const out = new Set();
    for (const part of s.split(',')) {
      const p = part.trim(); if (!p) continue;
      const m = p.match(/^(\d+)\s*[~\-]\s*(\d+)$/);
      if (m) range(+m[1], +m[2]).forEach(w => out.add(w));
      else if (/^\d+$/.test(p)) out.add(+p);
    }
    return [...out].filter(w => w >= 1 && w <= total).sort((a, b) => a - b);
  }
  function parseAvail(v, okSet) {
    const s = String(v ?? '가능').trim();
    if (s === '' || s === '가능') return new Set(okSet);
    if (s === '불가') return new Set();
    if (s === '오전') return new Set([...okSet].filter(p => p <= 4));
    if (s === '오후') return new Set([...okSet].filter(p => p >= 6));
    const out = new Set();
    for (const part of s.split(',')) {
      const m = part.trim().match(/^(\d+)\s*[~\-]\s*(\d+)$/);
      if (m) range(+m[1], +m[2]).forEach(p => okSet.has(p) && out.add(p));
      else if (/^\d+$/.test(part.trim()) && okSet.has(+part.trim())) out.add(+part.trim());
    }
    return out;
  }
  const gradeNum = g => parseInt(String(g), 10);

  function buildModel(state) {
    const S = state.settings, W = +S.weeks || 15;
    const okList = S.periods.filter(p => p.ok).map(p => +p.n).sort((a, b) => a - b);
    const okSet = new Set(okList);
    const maxP = Math.max(...S.periods.map(p => +p.n));
    const runs = []; // 연속 교시 묶음 (점심에서 끊김)
    for (const p of okList) { const last = runs[runs.length - 1]; if (last && last[last.length - 1] === p - 1) last.push(p); else runs.push([p]); }
    const startsFor = len => { const out = []; for (let d = 0; d < 5; d++) for (const r of runs) for (let i = 0; i + len <= r.length; i++) out.push([d, r[i]]); return out; };
    const warnings = [];
    const classSize = {}; for (const c of state.classes) classSize[c.grade + '|' + c.sec] = +c.size || 0;
    const profMap = {};
    for (const p of state.profs) {
      const allow = DAYS.map(d => parseAvail(p.avail?.[d], okSet));
      profMap[p.name] = { ...p, allow, dislike: DAYS.map(() => new Set()), like: DAYS.map(() => new Set()), why: DAYS.map(() => ({})) };
      DAYS.forEach((d, i) => { for (const n of okList) if (!allow[i].has(n)) profMap[p.name].why[i][n] = '출강 요일·시간 외'; });
    }
    for (const c of state.conds || []) {
      const P = profMap[c.prof]; const di = DAYS.indexOf(c.day);
      if (!P || di < 0) { if (c.prof) warnings.push(`교수조건: "${c.prof} ${c.day}" 를 찾을 수 없음`); continue; }
      for (const n of range(+c.s || 1, +c.e || +c.s || 1)) {
        if (c.type === '불가(반드시)') { P.allow[di].delete(n); P.why[di][n] = c.reason || '교수 불가 시간'; }
        else if (c.type === '비선호') P.dislike[di].add(n);
        else if (c.type === '선호') P.like[di].add(n);
      }
    }
    const rooms = state.rooms.map((r, i) => ({ ...r, i }));
    const roomByName = {}; rooms.forEach(r => roomByName[r.name] = r);
    const classKeys = state.classes.map(c => c.grade + '|' + c.sec);
    const blocked = { C: {}, R: {}, P: {} }; // key -> Set('d|p')
    for (const b of state.blocked || []) {
      const di = DAYS.indexOf(b.day); if (di < 0) continue;
      const t = String(b.target || '').trim(); let type, keys = [];
      let m;
      if (/^전체/.test(t)) { type = 'C'; keys = classKeys; }
      else if ((m = t.match(/^(\d)\s*학년\s*([A-Z])?$/))) { type = 'C'; keys = classKeys.filter(k => k.startsWith(m[1] + '학년|') && (!m[2] || k.endsWith('|' + m[2]))); }
      else if (roomByName[t]) { type = 'R'; keys = [t]; }
      else if (profMap[t]) { type = 'P'; keys = [t]; }
      else { warnings.push(`막힌시간: 대상 "${t}" 를 찾을 수 없음`); continue; }
      for (const k of keys) { blocked[type][k] ??= {}; for (const n of range(+b.s, +b.e || +b.s)) blocked[type][k][di + '|' + n] = b.reason || '막힌 시간'; }
    }
    // 주차 → 원자 구간(비트) 압축
    const sessions = [];
    const raw = [];
    for (const c of state.courses) {
      if (c.place !== '배치') continue;
      const blocks = String(c.blocks || '').split('+').map(x => parseInt(x, 10)).filter(x => x > 0);
      if (!blocks.length) { warnings.push(`${c.grade} ${c.name} ${c.sec}: 블록 구성이 비어 있어 배치하지 못함`); continue; }
      const cw = parseWeeks(c.weeks, W);
      const team = (state.team || []).filter(t => t.grade === c.grade && t.name === c.name && (t.sec === '전체' || t.sec === c.sec) && String(t.weeks ?? '').trim());
      let profs;
      if (team.length) {
        const maxTeamWeek = Math.max(...team.flatMap(t => parseWeeks(t.weeks, W)));
        const scale = maxTeamWeek > cw[cw.length - 1]; // 예: 3학년 1~8주 운영인데 분담이 1~15주로 적힌 경우 → 비례 환산
        profs = team.map(t => {
          let ws = parseWeeks(t.weeks, W);
          if (scale) ws = [...new Set(ws.map(w => cw[Math.min(cw.length - 1, Math.ceil(w * cw.length / maxTeamWeek) - 1)]))];
          ws = ws.filter(w => cw.includes(w));
          return { name: t.prof, weeks: ws };
        }).filter(p => p.weeks.length);
        if (scale) warnings.push(`${c.grade} ${c.name}: 팀티칭 주차(최대 ${maxTeamWeek}주)를 운영 주차 ${c.weeks} 에 비례해서 맞춤`);
      } else profs = c.prof ? [{ name: c.prof, weeks: cw }] : [];
      for (const p of profs) if (!profMap[p.name]) { warnings.push(`${c.name} ${c.sec}: 교수 "${p.name}" 가 교수목록에 없음 (조건 없이 배치)`); profMap[p.name] = { name: p.name, dmax: 99, cmax: 99, allow: DAYS.map(() => new Set(okSet)), dislike: DAYS.map(() => new Set()), like: DAYS.map(() => new Set()), why: DAYS.map(() => ({})) }; }
      const members = (c.members && c.members.length ? c.members : [c.sec]).map(m => c.grade + '|' + m);
      const students = +c.students || members.reduce((a, k) => a + (classSize[k] || 0), 0);
      let cands;
      if (c.fixed && c.fixed.length) cands = c.fixed.map(n => roomByName[n]).filter(Boolean);
      else cands = rooms.filter(r => r.group === (c.need || '일반 강의실'));
      if (!cands.length && c.need !== '가상강의동') warnings.push(`${c.name} ${c.sec}: 쓸 수 있는 강의실이 없음 (필요 공간: ${c.need || '-'})`);
      const practice = PRACTICE.has(c.need);
      let fit = practice ? cands : cands.filter(r => (+r.cap || 0) >= students);
      const capBad = !practice && cands.length && !fit.length;
      if (capBad) { fit = cands; warnings.push(`${c.name} ${c.sec}: 수강 ${students}명이 들어갈 강의실이 없음`); }
      let st = null;
      blocks.forEach((len, bi) => {
        const starts = startsFor(len).filter(([d]) => !c.days?.length || c.days.includes(DAYS[d]));
        if (!starts.length) warnings.push(`${c.name} ${c.sec}: ${len}시간 연속 블록을 넣을 시간대가 없음`);
        raw.push({ id: c.id + '#' + bi, cid: c.id, c, len, bi, cw, profs, members, students, rooms: fit.map(r => r.i), capBad, starts, practice });
      });
    }
    // 원자 구간
    const sigs = new Map();
    for (let w = 1; w <= W; w++) {
      let sig = raw.map(r => (r.cw.includes(w) ? '1' : '0') + r.profs.map(p => p.weeks.includes(w) ? '1' : '0').join('')).join('');
      if (!sigs.has(sig)) sigs.set(sig, []);
      sigs.get(sig).push(w);
    }
    const atoms = [...sigs.values()].filter(ws => raw.some(r => r.cw.includes(ws[0])));
    const maskOf = ws => atoms.reduce((m, a, i) => (ws.includes(a[0]) ? m | (1 << i) : m), 0);
    for (const r of raw) {
      r.mask = maskOf(r.cw);
      r.profs = r.profs.map(p => ({ name: p.name, mask: maskOf(p.weeks) })).filter(p => p.mask);
      sessions.push(r);
    }
    return { S, W, warnings: [...new Set(warnings)], okList, okSet, maxP, runs, profMap, rooms, blocked, sessions, atoms, classSize, opts: state.ruleOpts || {} };
  }

  function createSolver(state) {
    const M = buildModel(state);
    const N = M.sessions.length, A = M.atoms.length;
    const sd = new Int8Array(N), sp = new Int8Array(N), sr = new Int16Array(N);
    const locked = new Uint8Array(N);
    const opts = M.opts;
    const sameDayW = opts.sameDay === '가능하면' ? 30 : H;
    const retakeW = state.settings.retake === '반드시' ? H : state.settings.retake === '가능하면' ? 40 : 0;
    const gapW = opts.gaps === '사용 안 함' ? 0 : opts.gaps === '반드시' ? 50 : 2;
    const lateW = opts.late === '사용 안 함' ? 0 : 0.6;
    const dayMax = +opts.classDayMax || 0;
    const consecW = opts.consec === '반드시' ? H : 25;
    // 자원별 구성원
    const res = new Map(); // key -> {type, members:[{s, mask, tag, role}]}
    const add = (key, type, m) => { if (!res.has(key)) res.set(key, { type, name: key.slice(2), members: [] }); res.get(key).members.push(m); };
    const sesKeys = M.sessions.map(() => []);
    const tagIds = new Map(); const tagId = t => { if (!tagIds.has(t)) tagIds.set(t, tagIds.size); return tagIds.get(t); };
    M.sessions.forEach((s, i) => {
      for (const p of s.profs) { add('P:' + p.name, 'P', { s: i, mask: p.mask }); sesKeys[i].push('P:' + p.name); }
      for (const k of s.members) { add('C:' + k, 'C', { s: i, mask: s.mask, tid: tagId(s.c.grade + '|' + s.c.name) }); sesKeys[i].push('C:' + k); }
      add('U:' + s.cid, 'U', { s: i, mask: s.mask }); sesKeys[i].push('U:' + s.cid);
      if (retakeW) {
        const g = gradeNum(s.c.grade);
        add('G:' + g, 'G', { s: i, mask: s.mask, role: 0 }); sesKeys[i].push('G:' + g);
        if (s.c.common) { add('G:' + (g + 1), 'G', { s: i, mask: s.mask, role: 1 }); sesKeys[i].push('G:' + (g + 1)); }

    });
    const roomMembers = M.rooms.map(() => new Set());
    const cache = new Map();
    const P = M.maxP + 1;

    const ov = (i, j) => { // 두 수업이 겹치는 시간 수
      if (sd[i] !== sd[j] || !(M.sessions[i].mask & M.sessions[j].mask)) return 0;
      const a = Math.max(sp[i], sp[j]), b = Math.min(sp[i] + M.sessions[i].len, sp[j] + M.sessions[j].len);
      return b > a ? b - a : 0;
    };
    const ovm = (i, mi, j, mj) => (mi & mj) ? ovRaw(i, j) : 0;
    const ovRaw = (i, j) => { if (sd[i] !== sd[j]) return 0; const a = Math.max(sp[i], sp[j]), b = Math.min(sp[i] + M.sessions[i].len, sp[j] + M.sessions[j].len); return b > a ? b - a : 0; };
    // 자원마다 구별이 필요한 주차 구간만 미리 계산
    for (const r of res.values()) {
      const sig = new Map();
      for (let a = 0; a < A; a++) { const k = r.members.map(m => m.mask >> a & 1).join(''); if (!k.includes('1')) continue; if (!sig.has(k)) sig.set(k, a); }
      r.atoms = [...sig.values()];
    }
    const day = new Uint8Array(P);
    function evalRes(key) {
      if (key.charCodeAt(0) === 82) return evalRoom(+key.slice(2));
      const r = res.get(key); const mem = r.members; const n = mem.length;
      let cost = 0;
      if (r.type === 'U') {
        for (let x = 0; x < n; x++) for (let y = x + 1; y < n; y++) if (sd[mem[x].s] === sd[mem[y].s]) cost += sameDayW;
        return cost;
      }
      if (r.type === 'P') {
        const pr = M.profMap[r.name]; const bl = M.blocked.P[r.name];
        for (let x = 0; x < n; x++) {
          const i = mem[x].s, d = sd[i], e = sp[i] + M.sessions[i].len;
          for (let p = sp[i]; p < e; p++) {
            if (!pr.allow[d].has(p)) cost += H;
            if (bl && bl[d + '|' + p]) cost += H;
            if (pr.dislike[d].has(p)) cost += 3;
            if (pr.like[d].has(p)) cost -= 1;
          }
          for (let y = x + 1; y < n; y++) cost += H * ovm(i, mem[x].mask, mem[y].s, mem[y].mask);
        }
        const dmax = +pr.dmax || 99, cmax = +pr.cmax || 99;
        for (const a of r.atoms) for (let d = 0; d < 5; d++) {
          day.fill(0); let any = false;
          for (const m of mem) if (sd[m.s] === d && (m.mask >> a & 1)) { any = true; for (let p = sp[m.s]; p < sp[m.s] + M.sessions[m.s].len; p++) day[p] = 1; }
          if (!any) continue;
          let tot = 0, run = 0;
          for (let p = 1; p < P; p++) { if (day[p]) { tot++; run++; if (run > cmax) cost += consecW; } else run = 0; }
          if (tot > dmax) cost += H * (tot - dmax);
        }
        return cost;
      }
      if (r.type === 'C') {
        const bl = M.blocked.C[r.name];
        for (let x = 0; x < n; x++) {
          const i = mem[x].s, d = sd[i], e = sp[i] + M.sessions[i].len;
          for (let p = sp[i]; p < e; p++) { if (bl && bl[d + '|' + p]) cost += H; if (p >= 8) cost += lateW; }
          for (let y = x + 1; y < n; y++) if (mem[x].tid !== mem[y].tid) cost += H * ovm(i, mem[x].mask, mem[y].s, mem[y].mask);
        }
        if (gapW || dayMax) for (const a of r.atoms) for (let d = 0; d < 5; d++) {
          day.fill(0); let any = false;
          for (const m of mem) if (sd[m.s] === d && (m.mask >> a & 1)) { any = true; for (let p = sp[m.s]; p < sp[m.s] + M.sessions[m.s].len; p++) day[p] = 1; }
          if (!any) continue;
          let first = -1, last = -1, tot = 0;
          for (const p of M.okList) if (day[p]) { if (first < 0) first = p; last = p; tot++; }
          let gaps = 0; for (const p of M.okList) if (p > first && p < last && !day[p]) gaps++;
          cost += gapW * gaps * gaps;
          if (dayMax && tot > dayMax) cost += 15 * (tot - dayMax);

        return cost;
      }
      if (r.type === 'G') {
        for (let x = 0; x < n; x++) for (let y = x + 1; y < n; y++) if (mem[x].role !== mem[y].role) cost += retakeW * ovm(mem[x].s, mem[x].mask, mem[y].s, mem[y].mask);
        return cost;
      }
      return 0;
    }
    function evalRoom(ri) {
      const room = M.rooms[ri]; const bl = M.blocked.R[room.name];
      let cost = 0; const L = [...roomMembers[ri]];
      for (let x = 0; x < L.length; x++) {
        const i = L[x], s = M.sessions[i], d = sd[i];
        if (!s.practice && (+room.cap || 0) < s.students) cost += 50;
        if (bl) for (let p = sp[i]; p < sp[i] + s.len; p++) if (bl[d + '|' + p]) cost += H;
        for (let y = x + 1; y < L.length; y++) cost += H * ov(i, L[y]);
      }
      return cost;
    }
    function keysOf(i, extraRoom) { const k = sesKeys[i].slice(); if (sr[i] >= 0) k.push('R:' + sr[i]); if (extraRoom != null && extraRoom >= 0) k.push('R:' + extraRoom); return k; }
    let total = 0;
    function fullEval() { cache.clear(); total = 0; for (const k of res.keys()) { const v = evalRes(k); cache.set(k, v); total += v; } M.rooms.forEach((_, ri) => { const v = evalRoom(ri); cache.set('R:' + ri, v); total += v; }); return total; }
    function setRoom(i, r) { if (sr[i] >= 0) roomMembers[sr[i]].delete(i); sr[i] = r; if (r >= 0) roomMembers[r].add(i); }
    // changes: [[i,d,p,r]]
    function tryChanges(changes, T) {
      const keys = new Set();
      for (const [i, , , r] of changes) for (const k of keysOf(i, r)) keys.add(k);
      let before = 0; for (const k of keys) before += cache.get(k) ?? 0;
      const old = changes.map(([i]) => [i, sd[i], sp[i], sr[i]]);
      for (const [i, d, p, r] of changes) { sd[i] = d; sp[i] = p; setRoom(i, r); }

      for (const k of keys) { const v = evalRes(k); nv.push([k, v]); after += v; }
      const delta = after - before;
      if (delta <= 0 || (T > 0 && Math.random() < Math.exp(-delta / T))) { for (const [k, v] of nv) cache.set(k, v); total += delta; return true; }

    }
    const rnd = n => Math.floor(Math.random() * n);
    const pickRoom = (i, d, p) => {
      const s = M.sessions[i]; if (!s.rooms.length) return -1;
      let best = s.rooms[rnd(s.rooms.length)], bestC = 1e9;
      for (let t = 0; t < Math.min(4, s.rooms.length); t++) {
        const ri = t === 0 && sr[i] >= 0 && s.rooms.includes(sr[i]) ? sr[i] : s.rooms[rnd(s.rooms.length)];
        let c = 0;
        for (const j of roomMembers[ri]) if (j !== i && sd[j] === d && (M.sessions[j].mask & s.mask) && sp[j] < p + s.len && p < sp[j] + M.sessions[j].len) c++;
        if (!M.sessions[i].practice && (+M.rooms[ri].cap || 0) < s.students) c += 0.5;
        if (c < bestC) { bestC = c; best = ri; }
        if (c === 0) break;
      }
      return best;
    };
    // 초기 배치
    const lockMap = state.locked || {};
    const roomIdx = {}; M.rooms.forEach(r => roomIdx[r.name] = r.i);
    const prev = state.result?.assign || {};
    M.sessions.forEach((s, i) => {
      sr[i] = -1;
      const L = lockMap[s.id];
      const P0 = L || prev[s.id];
      if (P0 && s.starts.some(([d, p]) => d === P0.d && p === P0.p)) { sd[i] = P0.d; sp[i] = P0.p; setRoom(i, P0.room in roomIdx ? roomIdx[P0.room] : pickRoom(i, P0.d, P0.p)); if (L) locked[i] = 1; }
      else if (s.starts.length) { const [d, p] = s.starts[rnd(s.starts.length)]; sd[i] = d; sp[i] = p; setRoom(i, pickRoom(i, d, p)); }
      else { sd[i] = 0; sp[i] = M.okList[0]; }
    });
    fullEval();
    const movable = []; M.sessions.forEach((s, i) => { if (!locked[i] && s.starts.length) movable.push(i); });
    let best = total, bestState = null;
    const snap = () => ({ d: sd.slice(), p: sp.slice(), r: sr.slice() });
    bestState = snap();

    function greedy(order) {
      for (const i of order) {
        const s = M.sessions[i]; let bestC = null, bestD = Infinity;
        for (const [d, p] of s.starts) {
          const r = pickRoom(i, d, p);
          const keys = new Set(keysOf(i, r)); let before = 0; for (const k of keys) before += cache.get(k) ?? 0;
          const o = [sd[i], sp[i], sr[i]]; sd[i] = d; sp[i] = p; setRoom(i, r);
          let after = 0; for (const k of keys) after += evalRes(k);
          sd[i] = o[0]; sp[i] = o[1]; setRoom(i, o[2]);
          const delta = after - before + Math.random() * 0.01;
          if (delta < bestD) { bestD = delta; bestC = [i, d, p, r]; }
        }
        if (bestC) tryChanges([bestC], 0);
      }
    }
    async function run({ iterations = 300000, onProgress, yieldEvery = 5000, shouldStop } = {}) {
      if (!movable.length) return result();
      if (!Object.keys(prev).length) {
        const order = movable.slice().sort((a, b) => M.sessions[a].starts.length * (M.sessions[a].rooms.length || 1) - M.sessions[b].starts.length * (M.sessions[b].rooms.length || 1) || M.sessions[b].len - M.sessions[a].len);
        greedy(order);
        if (total < best) { best = total; bestState = snap(); }

        const T0 = round ? 150 : 1500, T1 = 0.3;
        for (let it = 0; it < per; it++) {

          if (u < 0.7) { const [d, p] = s.starts[rnd(s.starts.length)]; tryChanges([[i, d, p, pickRoom(i, d, p)]], T); }
          else if (u < 0.8) { if (s.rooms.length > 1) tryChanges([[i, sd[i], sp[i], s.rooms[rnd(s.rooms.length)]]], T); }
          else {
            const j = movable[rnd(movable.length)];
            if (j !== i && M.sessions[j].len === s.len && s.starts.some(([d, p]) => d === sd[j] && p === sp[j]) && M.sessions[j].starts.some(([d, p]) => d === sd[i] && p === sp[i]))
              tryChanges([[i, sd[j], sp[j], sr[i]], [j, sd[i], sp[i], sr[j]]], T);

      for (let i = 0; i < N; i++) setRoom(i, bestState.r[i]);

    }

    function result() {
      const assign = {};
      M.sessions.forEach((s, i) => { if (s.starts.length) assign[s.id] = { d: sd[i], p: sp[i], room: sr[i] >= 0 ? M.rooms[sr[i]].name : '' }; });
      return { assign, score: Math.round(total), issues: check(state, assign, M), warnings: M.warnings, at: new Date().toISOString() };
    }
    return { model: M, run, result };
  }

  // 사람이 읽을 수 있는 점검 결과 (수동 수정 후에도 다시 씀)
  function check(state, assign, M) {
    M = M || buildModel(state);
    const issues = [];
    const label = s => `${s.c.grade} ${s.c.name}${s.c.sec ? ' ' + s.c.sec : ''}`;
    const atomTxt = mask => { const ws = M.atoms.filter((_, a) => mask >> a & 1).flat(); return ws.length === M.W || !ws.length ? '' : ` (${ws[0]}~${ws[ws.length - 1]}주)`; };
    const occ = {}; // key -> 'd|p|a' -> [labels]
    const put = (key, d, p, mask, lab, tag) => { for (let a = 0; a < M.atoms.length; a++) if (mask >> a & 1) { const k = d + '|' + p + '|' + a; ((occ[key] ??= {})[k] ??= []).push({ lab, tag, a }); } };
    const profDay = {};
    for (const s of M.sessions) {
      const A0 = assign[s.id];
      if (!A0) { issues.push({ level: '반드시', kind: '배치 불가', text: `${label(s)}: 넣을 수 있는 시간대가 없음` }); continue; }
      const { d, p, room } = A0;
      const when = `${DAYS[d]} ${p}${s.len > 1 ? '~' + (p + s.len - 1) : ''}교시`;
      for (const pr of s.profs) {
        const P = M.profMap[pr.name];
        const bad = []; for (let x = p; x < p + s.len; x++) if (!P.allow[d].has(x) || M.blocked.P[pr.name]?.[d + '|' + x]) bad.push(x);
        if (bad.length) issues.push({ level: '반드시', kind: '교수 불가 시간', who: pr.name, text: `${pr.name} — ${label(s)} ${when}: ${P.why[d][bad[0]] || M.blocked.P[pr.name]?.[d + '|' + bad[0]] || '불가 시간'}` });
        let dis = 0; for (let x = p; x < p + s.len; x++) if (P.dislike[d].has(x)) dis++;
        if (dis) issues.push({ level: '가능하면', kind: '비선호 시간', who: pr.name, text: `${pr.name} — ${label(s)} ${when}: 비선호 시간` });
        for (let x = p; x < p + s.len; x++) put('P:' + pr.name, d, x, pr.mask, label(s));
        (profDay[pr.name] ??= []).push({ d, p, len: s.len, mask: pr.mask });
      }
      for (const k of s.members) {
        for (let x = p; x < p + s.len; x++) { put('C:' + k, d, x, s.mask, label(s), s.c.grade + s.c.name); const b = M.blocked.C[k]?.[d + '|' + x]; if (b) issues.push({ level: '반드시', kind: '막힌 시간', text: `${label(s)} ${when}: ${k.replace('|', ' ')}반 막힌 시간(${b})` }); }
      }
      if (room) {
        for (let x = p; x < p + s.len; x++) put('R:' + room, d, x, s.mask, label(s));
        const R = M.rooms.find(r => r.name === room);
        if (R && !s.practice && (+R.cap || 0) < s.students) issues.push({ level: '가능하면', kind: '강의실 인원', text: `${label(s)}: ${room} 수용 ${R.cap}명 < 수강 ${s.students}명` });
      } else if (s.c.need !== '가상강의동') issues.push({ level: '반드시', kind: '강의실 없음', text: `${label(s)}: 배정할 강의실이 없음` });
    }
    const wk = atomsList => { const ws = atomsList.map(a => M.atoms[a]).flat().sort((x, y) => x - y); if (!ws.length || ws.length === M.W) return ''; const parts = []; let s0 = ws[0], pv = ws[0]; for (const w of ws.slice(1).concat([null])) { if (w === pv + 1) { pv = w; continue; } parts.push(s0 === pv ? '' + s0 : s0 + '~' + pv); s0 = pv = w; } return ' (' + parts.join(', ') + '주)'; };
    const grp = new Map();
    for (const key in occ) for (const k in occ[key]) {
      const L = occ[key][k];
      const tags = new Set(L.map(x => x.tag ?? x.lab));

        const [d, p, a] = k.split('|').map(Number);
        const names = [...new Set(L.map(x => x.lab))].sort();

        grp.get(g).ps.add(p); grp.get(g).atoms.add(a);

      const ps = [...x.ps].sort((a, b) => a - b);
      const typ = { P: '교수 겹침', C: '분반 겹침', R: '강의실 겹침' }[x.key[0]];
      issues.push({ level: '반드시', kind: typ, who: x.key[0] === 'P' ? x.key.slice(2) : undefined, text: `${x.key.slice(2).replace('|', ' ')}${x.key[0] === 'C' ? '반' : ''} ${DAYS[x.d]} ${ps[0]}${ps.length > 1 ? '~' + ps[ps.length - 1] : ''}교시${wk([...x.atoms])}: ${x.names.join(' / ')}` });
    }
    for (const name in profDay) {
      const P = M.profMap[name]; const dmax = +P.dmax || 99, cmax = +P.cmax || 99;
      for (let d = 0; d < 5; d++) {
        let worstH = 0, worstR = 0; const aH = [], aR = [];
        for (let a = 0; a < M.atoms.length; a++) {
          const hrs = new Set(); for (const x of profDay[name]) if (x.d === d && (x.mask >> a & 1)) for (let q = x.p; q < x.p + x.len; q++) hrs.add(q);
          if (hrs.size > dmax) { aH.push(a); worstH = Math.max(worstH, hrs.size); }

// ---------- 시간표 ----------
function sessionsAt() {
  const M = getModel(); const A = S.result?.assign || {};
  const wa = M.atoms.findIndex(a => a.includes(+ui.week));
  return M.sessions.filter(s => A[s.id] && wa >= 0 && (s.mask >> wa & 1)).map(s => ({ s, a: A[s.id], profs: s.profs.filter(p => p.mask >> wa & 1).map(p => p.name) }));
}
function chip(x, p, sub) {
  const first = p === x.a.p; const lock = S.locked?.[x.s.id];
  return `<button class="chip ${gcls(x.s.c.grade)}${first ? '' : ' cont'}${x.clash ? ' clash' : ''}${lock && first ? ' lock' : ''}" data-sid="${esc(x.s.id)}" title="${esc(x.s.c.name + ' ' + x.s.c.sec + ' · ' + x.profs.join(', ') + ' · ' + (x.a.room || ''))}"><b>${esc(x.s.c.name)}${first ? '' : ' ↳'}</b>${first ? `<span>${esc(sub(x))}</span>` : ''}</button>`;
}
function grid(cols, cellFn, colLabel) {
  const per = S.settings.periods; const okN = per.filter(p => p.ok).map(p => +p.n);
  const maxOk = Math.max(...okN), minOk = Math.min(...okN);
  const rows = per.filter(p => +p.n >= minOk && +p.n <= maxOk);
  let h = `<div class="scroll"><table class="tt${cols.length > 6 ? ' wide' : ''}"><thead><tr><th class="day"></th><th class="per">교시</th>${cols.map(c => `<th>${esc(colLabel(c))}</th>`).join('')}</tr></thead><tbody>`;
  DAYS.forEach((d, di) => rows.forEach((p, ri) => {
    const last = ri === rows.length - 1;
    if (!p.ok) { h += `<tr class="lunch${last ? ' dayend' : ''}">${ri === 0 ? `<th class="day" rowspan="${rows.length}">${d}</th>` : ''}<td class="per"></td><td colspan="${cols.length}">${esc(p.note || '배치 안 함')}</td></tr>`; return; }
    h += `<tr class="${last ? 'dayend' : ''}">${ri === 0 ? `<th class="day" rowspan="${rows.length}">${d}</th>` : ''}<td class="per"><b>${p.n}교시</b>${esc(p.start)}</td>${cols.map(c => cellFn(c, di, +p.n)).join('')}</tr>`;
  }));
  return h + '</tbody></table></div>';
}
function renderTT() {
  const M = getModel(); const all = sessionsAt();
  const grades = [...new Set(S.classes.map(c => c.grade))];
  const profs = S.profs.map(p => p.name); const rooms = S.rooms.map(r => r.name);
  if (!ui.prof) ui.prof = profs[0] || ''; if (!ui.room) ui.room = rooms[0] || '';
  const wkOpts = Array.from({ length: +S.settings.weeks }, (_, i) => `<option value="${i + 1}"${+ui.week === i + 1 ? ' selected' : ''}>${i + 1}주</option>`).join('');
  let pick = '';
  if (ui.view === 'grade') pick = `<label>학년 <select id="selG">${['전체', ...grades].map(g => `<option${g === ui.grade ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select></label>`;
  if (ui.view === 'prof') pick = `<label>교수 <select id="selP">${profs.map(g => `<option${g === ui.prof ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select></label>`;
  if (ui.view === 'room') pick = `<label>강의실 <select id="selR">${rooms.map(g => `<option${g === ui.room ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select></label>`;
  let h = `<div class="bar"><div class="seg">${[['grade', '학년별'], ['prof', '교수별'], ['room', '강의실별']].map(([k, l]) => `<button data-view="${k}" aria-pressed="${ui.view === k}">${l}</button>`).join('')}</div>${pick}<label>주차 <select id="selW">${wkOpts}</select></label><span class="small">수업을 누르면 시간·강의실을 옮기거나 고정할 수 있습니다.</span></div>`;
  if (!S.result) { $('#main').innerHTML = h + `<div class="card empty">아직 배치하지 않았습니다. 위의 <b>자동 배치</b>를 눌러 주세요.</div>`; return; }
  const hit = (x, d, p) => x.a.d === d && p >= x.a.p && p < x.a.p + x.s.len;
  const mark = L => { const t = new Set(L.map(x => x.s.c.grade + x.s.c.name)); L.forEach(x => x.clash = L.length > 1 && t.size > 1); return L; };
  if (ui.view === 'grade') {
    const cls = S.classes.filter(c => ui.grade === '전체' || c.grade === ui.grade);
    h += grid(cls, (c, d, p) => {
      const L = mark(all.filter(x => x.s.c.grade === c.grade && x.s.members.includes(c.grade + '|' + c.sec) && hit(x, d, p)));
      return `<td>${L.map(x => chip(x, p, x => (x.s.c.sec !== c.sec ? x.s.c.sec + (x.s.practice ? '조' : '분반') + ' · ' : '') + x.profs.join(', ') + ' · ' + (x.a.room || '온라인'))).join('')}</td>`;
    }, c => (ui.grade === '전체' ? c.grade.replace('학년', '') + '-' : '') + c.sec + '반' + (ui.grade === '전체' ? '' : ' (' + c.size + '명)'));
  } else if (ui.view === 'prof') {

    h += weekGrid(x => x.profs.includes(ui.prof), (d, p) => P && !P.allow[d].has(p), x => `${x.s.c.grade.replace('학년', '')}-${x.s.c.sec} · ${x.a.room || '온라인'}`);
  } else {
    h += weekGrid(x => x.a.room === ui.room, () => false, x => `${x.s.c.grade.replace('학년', '')}-${x.s.c.sec} · ${x.profs.join(', ')}`);
  }
  h += `<div class="legend">${grades.map(g => `<span class="${gcls(g)}"><i></i>${esc(g)}</span>`).join('')}<span>빨간 테두리 = 겹침</span>${ui.view === 'prof' ? '<span>빗금 = 출강 불가 시간</span>' : ''}</div>`;
  if (ui.view === 'prof') {
    const P = M.profMap[ui.prof]; const mine = (S.result.issues || []).filter(i => i.who === ui.prof);
    h += `<div class="card" style="margin-top:14px"><h2>${esc(ui.prof)} 교수 조건</h2><div class="small">하루 최대 ${esc(P?.dmax)}시간 · 연속 최대 ${esc(P?.cmax)}시간 · 출강 ${DAYS.map(d => d + ' ' + esc(S.profs.find(x => x.name === ui.prof)?.avail?.[d] || '가능')).join(' / ')}</div>${mine.length ? `<ul class="issues">${mine.map(i => `<li><span class="badge ${i.level === '반드시' ? 'bad' : 'warn'}">${i.level}</span>${esc(i.text)}</li>`).join('')}</ul>` : '<p class="small">이 주차 기준 위반 없음</p>'}</div>`;
  }
  $('#main').innerHTML = h;
  function weekGrid(filter, naFn, sub) {
    const per = S.settings.periods.filter(p => p.ok || (+p.n > Math.min(...S.settings.periods.filter(q => q.ok).map(q => +q.n)) && +p.n < Math.max(...S.settings.periods.filter(q => q.ok).map(q => +q.n))));
    let t = `<div class="scroll"><table class="tt"><thead><tr><th class="per">교시</th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>`;
    for (const p of per) {
      if (!p.ok) { t += `<tr class="lunch"><td class="per"></td><td colspan="5">${esc(p.note || '배치 안 함')}</td></tr>`; continue; }
      t += `<tr><td class="per"><b>${p.n}교시</b>${esc(p.start)}</td>${DAYS.map((_, d) => { const L = all.filter(x => filter(x) && hit(x, d, +p.n)); L.forEach(x => x.clash = L.length > 1); return `<td class="${naFn(d, +p.n) ? 'na' : ''}">${L.map(x => chip(x, +p.n, sub)).join('')}</td>`; }).join('')}</tr>`;
    }
    return t + '</tbody></table></div>';
  }
}

function openSession(sid) {

  <div class="row"><label for="mvT">시간</label><select id="mvT">${starts.map(([d, p]) => `<option value="${d}|${p}"${d === a.d && p === a.p ? ' selected' : ''}>${DAYS[d]} ${p}~${p + s.len - 1}교시</option>`).join('')}</select></div>

  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="mvX">닫기</button><button class="btn pri" id="mvOK">적용</button></div>`;
  const preview = () => {
    const [d, p] = $('#mvT').value.split('|').map(Number);
    const test = { ...S.result.assign, [sid]: { d, p, room: $('#mvR').value } };
    const before = (S.result.issues || []).filter(i => i.level === '반드시').length;
    const after = TT.check(S, test, M).filter(i => i.level === '반드시').length;
    $('#mvMsg').textContent = `옮기면 반드시 위반 ${before} → ${after}`;
  };
  $('#mvT').onchange = preview; $('#mvR').onchange = preview; preview();
  $('#mvX').onclick = () => dlg.close();

function editor(rows, cols, opt = {}) {
  const id = 'ed' + Math.random().toString(36).slice(2, 7);
  const vis = rows.map((r, i) => [r, i]).filter(([r]) => !opt.filter || opt.filter(r));
  const cell = (r, c, i) => {
    let v = r[c.k]; if (Array.isArray(v)) v = v.join(', ');
    if (c.ro) return `<td class="ro">${esc(typeof c.ro === 'function' ? c.ro(r) : v)}</td>`;
    if (c.opts) { const o = typeof c.opts === 'function' ? c.opts(r) : c.opts; return `<td><select data-i="${i}" data-k="${c.k}">${(o.includes(v ?? '') ? o : [v ?? '', ...o]).map(x => `<option${x === (v ?? '') ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></td>`; }
    return `<td><input type="${c.num ? 'number' : 'text'}" data-i="${i}" data-k="${c.k}" value="${esc(v)}"${c.ph ? ` placeholder="${esc(c.ph)}"` : ''}></td>`;
  };
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener('change', e => {
      const t = e.target; const i = +t.dataset.i, k = t.dataset.k; if (!k) return;
      const c = cols.find(x => x.k === k); let v = t.value;
      if (c.list) v = v.split(',').map(x => x.trim()).filter(Boolean);
      else if (c.num) v = v === '' ? '' : +v;
      rows[i][k] = v; opt.onChange && opt.onChange(rows[i], k); invalidate(); if (opt.rerender) render();
    });
    el.addEventListener('click', e => { const b = e.target.closest('.del'); if (!b) return; rows.splice(+b.dataset.i, 1); invalidate(); render(); });
  });
  return `<div class="edwrap"><table class="ed" id="${id}"><thead><tr>${cols.map(c => `<th style="min-width:${c.w || 80}px">${esc(c.label)}</th>`).join('')}<th></th></tr></thead><tbody>${vis.map(([r, i]) => `<tr class="${opt.rowCls ? opt.rowCls(r) : ''}">${cols.map(c => cell(r, c, i)).join('')}<td style="width:44px"><button class="del" data-i="${i}" aria-label="줄 삭제">×</button></td></tr>`).join('') || `<tr><td colspan="${cols.length + 1}" class="ro">항목 없음</td></tr>`}</tbody></table></div>`;
}

// ---------- 자동 배치 ----------
async function runSolver() {
  const dlg = $('#dlg'); let stop = false;
  const hasPrev = !!S.result;
  dlg.innerHTML = `<h3>자동 배치</h3><p class="small">조건을 지키면서 교수·분반·강의실이 겹치지 않는 자리를 찾습니다. 몇 초 걸립니다.</p>
  ${hasPrev ? `<label class="small"><input type="checkbox" id="fresh"> 처음부터 새로 배치 (지금 시간표를 버리고, 고정한 수업만 유지)</label>` : ''}
  <div class="prog"><i id="pg"></i></div><div class="small" id="pgT">준비</div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="rX">닫기</button><button class="btn pri" id="rGo">시작</button></div>`;
  dlg.showModal();
  $('#rX').onclick = () => { stop = true; dlg.close(); };
  $('#rGo').onclick = async () => {
    $('#rGo').disabled = true;
    const st = JSON.parse(JSON.stringify(S));
    if (!hasPrev || $('#fresh')?.checked) st.result = null;
    try {
      const sv = TT.createSolver(st);
      const r = await sv.run({ iterations: 400000, shouldStop: () => stop, onProgress: (f, b) => { $('#pg').style.width = (f * 100).toFixed(0) + '%'; $('#pgT').textContent = `${(f * 100).toFixed(0)}% · 반드시 위반 약 ${Math.floor(b / 1000)}건`; } });
      if (stop) return;
      S.result = r; model = null; markDirty();
      const hard = r.issues.filter(i => i.level === '반드시').length;
      $('#pg').style.width = '100%'; $('#pgT').textContent = hard ? `완료 · 반드시 위반 ${hard}건 — 점검 결과 탭에서 확인하세요` : '완료 · 반드시 조건 모두 지킴';
      $('#rGo').textContent = '다시 실행'; $('#rGo').disabled = false; render();
    } catch (e) { $('#pgT').textContent = '오류: ' + e.message; $('#rGo').disabled = false; }
  };
}

// ---------- 저장 ----------
async function save() {
  if (HOST !== 'server' && !art) return toast('이 화면에서는 저장할 수 없습니다');
  S.savedAt = new Date().toISOString();
  const clean = JSON.parse(JSON.stringify(S));
  clean.courses.forEach(c => delete c.commonTxt); clean.rooms.forEach(r => delete r.sharedTxt); clean.settings.periods.forEach(p => delete p.okTxt); clean.profs.forEach(p => DAYS.forEach(d => delete p['av_' + d]));
  if (HOST === 'server') {
    $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중';
    try {
      const r = await fetch('api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ base: ver, state: clean }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 409) toast(`${j.savedBy || '다른 사람'} 님이 ${j.savedAt ? new Date(j.savedAt).toLocaleString('ko-KR') : ''}에 먼저 저장했습니다. 새로고침하면 그 내용을 볼 수 있습니다 (지금 작업은 엑셀로 내보내 두세요)`);
      else if (r.status === 401) toast('로그인이 풀렸습니다. 새 창에서 다시 로그인한 뒤 저장해 주세요');
      else if (!r.ok) toast('저장하지 못했습니다');
      else { ver = j.version; dirty = false; $('#saveBtn').classList.remove('dirty'); try { localStorage.removeItem('tt-draft'); } catch (e) {} toast('저장했습니다'); }
    } catch (e) { toast('저장하지 못했습니다 (인터넷 연결 확인)'); }
    $('#saveBtn').disabled = false; $('#saveBtn').textContent = '저장'; return;
  }
  const json = JSON.stringify(clean).replace(/</g, '\\u003c');
  const html = SRC.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '저장 중';
  try { await art.publish(html); dirty = false; $('#saveBtn').classList.remove('dirty'); try { localStorage.removeItem('tt-draft'); } catch (e) {} toast('저장했습니다'); }
  catch (e) { toast(e?.code === 'conflict' ? '다른 사람이 먼저 저장했습니다. 새로 불러온 내용에 다시 작업해 주세요' : e?.code === 'not_writer' || e?.code === 'not_granted' ? '저장 권한이 없습니다 (보기 전용)' : '저장하지 못했습니다'); }
  $('#saveBtn').disabled = false; $('#saveBtn').textContent = '저장';
}

function readXlsx(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sh = n => { const ws = wb.Sheets[n]; if (!ws) throw new Error(`"${n}" 탭이 없습니다`); return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true }); };
  const table = (n, hdrRow = 0) => { const a = sh(n); const hdr = (a[hdrRow] || []).map(x => String(x ?? '').trim()); return a.slice(hdrRow + 1).filter(r => r.some(v => v !== null && v !== '')).map(r => Object.fromEntries(hdr.map((h, i) => [h, r[i]]))); };
  const lst = v => String(v ?? '').split(',').map(x => x.trim()).filter(Boolean);
  const tm = v => v instanceof Date ? String(v.getHours()).padStart(2, '0') + ':' + String(v.getMinutes()).padStart(2, '0') : (typeof v === 'number' ? (() => { const m = Math.round(v * 1440); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); })() : String(v ?? ''));
  const bs = sh('기본설정'); const hi = bs.findIndex(r => r[0] === '교시');
  const val = label => (bs.find(r => r[0] && String(r[0]).startsWith(label)) || [])[1];
  const N = {};
  N.settings = { semester: val('학기') || '', weeks: +val('학기 주수') || 15, retake: val('학년 간 공통') || '사용 안 함',
    periods: table('기본설정', hi).filter(r => r['교시'] !== null && r['교시'] !== '').map((r, i) => ({ n: parseInt(r['교시'], 10) || i + 1, start: tm(r['시작']), end: tm(r['종료']), ok: (r['배치'] ?? '가능') === '가능', note: r['비고'] || '' })) };
  N.classes = table('분반').filter(r => /학년/.test(r['학년'] ?? '') && r['분반']).map(r => ({ grade: r['학년'], sec: String(r['분반']), size: +r['인원'] || 0, weeks: r['운영 주차'] || '' }));
  const asg = {}; table('담당배정').forEach(r => asg[`${r['학년']}|${r['과목명']}|${r['분반']}`] = r);
  N.courses = table('교과목').filter(r => r['과목명']).map(r => { const sec = String(r['분반(수업 단위)'] ?? r['분반'] ?? ''); const id = `${r['학년']}|${r['과목명']}|${sec}`; const a = asg[id] || {}; return {
    id, grade: r['학년'], name: r['과목명'], sec, kind: r['이수구분'] || '', credit: r['학점'], th: r['주당 이론 시수'], pr: r['주당 실습 시수'],
    place: r['배치 여부'] || '배치', blocks: String(r['블록 구성'] ?? ''), weeks: String(r['운영 주차'] ?? ''), members: lst(r['소속 분반']), days: lst(r['배치 가능 요일']),
    need: r['필요 공간'] || '', fixed: lst(r['지정 공간']), common: r['여러 학년 공통'] === '예', students: r['수강 인원'] ?? '', note: r['비고'] || '', orig: r['원래 수업 나누기'] || '',
    prof: a['담당교수'] || '', co: lst(a['공동 담당교수']) }; });

    addP: () => S.profs.unshift({ name: '', kind: '전임', dmax: 8, cmax: 8, avail: Object.fromEntries(DAYS.map(d => [d, '가능'])), note: '' }),
    addCond: () => S.conds.unshift({ prof: '', day: '월', s: 1, e: 2, type: '불가(반드시)', reason: '' }),
    addT: () => S.team.unshift({ grade: '1학년', name: '', sec: '전체', prof: '', weeks: '', hours: '', note: '' }),
    addR: () => S.rooms.unshift({ bldg: '', name: '', type: '강의실', group: '일반 강의실', cap: 50, shared: false, note: '' }),
    addB: () => S.blocked.unshift({ target: '전체 학년', day: '수', s: 7, e: 9, reason: '' }),
    addRule: () => S.rules.push({ text: '', level: '가능하면', target: '', note: '' }),
    addCls: () => S.classes.push({ grade: '1학년', sec: '', size: 50, weeks: '' }) }[t.id];
  if (addRow) { addRow(); invalidate(); render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selG') ui.grade = t.value; else if (t.id === 'selP') ui.prof = t.value; else if (t.id === 'selR') ui.room = t.value; else if (t.id === 'selW') ui.week = +t.value; else if (t.id === 'cq') ui.q = t.value; else return;
  render();
});
$('#runBtn').onclick = runSolver;
$('#saveBtn').onclick = save;
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  if (!window.XLSX) return toast('엑셀 도구를 불러오지 못했습니다');
  try { const N = readXlsx(await f.arrayBuffer()); S = { ...S, ...N, locked: {}, result: null }; model = null; markDirty(); ui.tab = 'crs'; render(); toast(`불러옴: 교과목 ${N.courses.length}줄, 교수 ${N.profs.length}명. 자동 배치를 눌러 주세요`); }
  catch (err) { toast('불러오지 못했습니다: ' + err.message); }
};
$('#xlsBtn').onclick = async () => {
  const fname = `시간표_${(S.settings.semester || '').replace(/\s+/g, '')}.xlsx`;
  if (HOST === 'server') { try { const blob = new Blob([writeXlsx()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); } catch (e) { toast('내보내지 못했습니다'); } return; }
  if (!dl) return toast('이 화면에서는 파일을 내려받을 수 없습니다');
  try { const data = writeXlsx(); await dl.save({ filename: `시간표_${(S.settings.semester || '').replace(/\s+/g, '')}.xlsx`, data: new Uint8Array(data) }); toast('엑셀 파일을 내보냈습니다'); }
  catch (err) { if (err?.code !== 'declined') toast('내보내지 못했습니다'); }
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function recoverDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('tt-draft') || 'null');
    if (d && d.base === S.savedAt && d.at) {
      $('#banner').innerHTML = `<div class="banner">저장하지 않은 작업이 이 브라우저에 남아 있습니다 (${new Date(d.at).toLocaleString('ko-KR')}). <button class="btn sm" id="rcY">이어서 하기</button><button class="btn sm" id="rcN">버리기</button></div>`;
      $('#rcY').onclick = () => { S = d.state; model = null; dirty = true; $('#banner').innerHTML = ''; render(); $('#saveBtn').classList.add('dirty'); };
      $('#rcN').onclick = () => { localStorage.removeItem('tt-draft'); $('#banner').innerHTML = ''; };
    }
  } catch (e) {}
}
if (HOST === 'server') {
  $('#main').innerHTML = '<div class="empty">불러오는 중…</div>';
  Promise.all([fetch('api/state').then(r => { if (r.status === 401) { location.href = 'login'; throw 0; } return r.json(); }), fetch('api/me').then(r => r.json())]).then(([st, m]) => {
    S = st.state; ver = st.version; me = m;
    $('#who').innerHTML = `${esc(m.name)} · <a href="account" style="color:inherit">계정</a> · <a href="logout" style="color:inherit">로그아웃</a>`;
    recoverDraft(); render();
  }).catch(e => { if (e !== 0) $('#main').innerHTML = '<div class="empty">불러오지 못했습니다. 새로고침해 주세요.</div>'; });
} else {
  recoverDraft(); render();
  (async () => {
    try { art = await window.claude?.use?.('artifact'); } catch (e) { art = null; }
    try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; }
    renderStat();
  })();
}
}
</script>
</body>
</html>
