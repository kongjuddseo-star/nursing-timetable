<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · 간호학과 시간표</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f6f3,#15181c);--paper:light-dark(#fff,#1e2228);--ink:light-dark(#1c232b,#e7eaee);--mute:light-dark(#66707b,#9aa4ae);--line:light-dark(#dfe2e5,#343a42);--bad:light-dark(#c62828,#ff7b72)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:380px;margin:8vh auto;padding:0 16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}p.m{color:var(--mute);margin:0 0 16px;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}input,select{font:inherit;color:inherit;width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
button{font:inherit;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-weight:600}button.s{background:var(--paper);color:var(--ink);border-color:var(--line);min-height:34px;font-weight:500}
.err{color:var(--bad);font-size:14px;margin:8px 0}.ok{font-size:14px;margin:8px 0}a{color:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row input,.row select{width:auto;min-height:34px}
</style></head><body><div class="wrap">
<div class="card"><h1>간호학과 시간표 배치</h1><p class="m">학과 시간표 담당자만 쓸 수 있습니다.</p>
<form method="post" action="login">
<label for="i">아이디</label><input id="i" name="login_id" autocomplete="username" required autofocus>
<label for="p">비밀번호</label><input id="p" name="password" type="password" autocomplete="current-password" required>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<div style="height:14px"></div><button style="width:100%">로그인</button></form></div>
<p class="m" style="text-align:center">비밀번호를 잊으면 관리자에게 초기화를 부탁해 주세요.</p></div></body></html>
